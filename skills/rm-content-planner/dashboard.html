<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Plan Dashboard</title>
<!--
  rm-content-planner — REUSABLE dashboard.
  HOW TO USE: replace the PLAN object near the bottom of this file with the run's
  structured plan (the same data submit_content_plan receives, plus the strategy
  fields), then hand this file to the creator (render it inline, or open in a
  browser). Everything below renders FROM that object — do not hand-edit the markup.
  Self-contained: no external fonts, scripts, styles, or network calls.
-->
<style>
  /* Tokens mirror Reach Machine's own app palette (frontend/src/index.css) —
     the same brand orange, surfaces and radius used on /watchlist, /strategy, /cta,
     so a plan opened outside the app still looks like it came from Reach Machine. */
  :root{
    --bg:#EDF0F4; --surface:#FBFCFD; --surface-2:#E5E9EF; --line:#DDE1E6;
    --ink:#111827; --ink-2:#5C6470; --muted:#9CA3AF;
    --accent:#F04E23; --accent-hover:#D94420; --accent-muted:#FEF0EB;   /* RM brand orange */
    /* data categories — each is ALWAYS shown with its text label, never color alone */
    --reach:#3B82F6; --nurture:#F59E0B; --activation:#EF4444;      /* funnel roles (info/warning/danger) */
    --dd:#10B981; --di:#F59E0B; --jg:#6B7280;                       /* provenance / confidence */
    --shadow:0 1px 2px rgba(17,24,39,.04),0 1px 3px rgba(17,24,39,.04);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0D1117; --surface:#1A1F27; --surface-2:#242A33; --line:#2A303A;
      --ink:#E5E7EB; --ink-2:#9CA3AF; --muted:#6E7681;
      --accent:#FE582C; --accent-hover:#D94420; --accent-muted:#3C0800;
      --reach:#3B82F6; --nurture:#F59E0B; --activation:#EF4444;
      --dd:#10B981; --di:#F59E0B; --jg:#9CA3AF;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 6px rgba(0,0,0,.2);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1117; --surface:#1A1F27; --surface-2:#242A33; --line:#2A303A;
    --ink:#E5E7EB; --ink-2:#9CA3AF; --muted:#6E7681;
    --accent:#FE582C; --accent-hover:#D94420; --accent-muted:#3C0800;
    --reach:#3B82F6; --nurture:#F59E0B; --activation:#EF4444;
    --dd:#10B981; --di:#F59E0B; --jg:#9CA3AF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 6px rgba(0,0,0,.2);
  }
  :root[data-theme="light"]{
    --bg:#EDF0F4; --surface:#FBFCFD; --surface-2:#E5E9EF; --line:#DDE1E6;
    --ink:#111827; --ink-2:#5C6470; --muted:#9CA3AF;
    --accent:#F04E23; --accent-hover:#D94420; --accent-muted:#FEF0EB;
    --reach:#3B82F6; --nurture:#F59E0B; --activation:#EF4444;
    --dd:#10B981; --di:#F59E0B; --jg:#6B7280;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; font-size:15px;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:20px 18px 64px}
  h1,h2,h3{margin:0; line-height:1.2; text-wrap:balance}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  a{color:var(--accent)}

  /* top bar */
  .topbar{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px;
    display:flex; flex-wrap:wrap; gap:14px 24px; align-items:flex-start; justify-content:space-between;
  }
  .topbar .who{min-width:min(100%,420px); flex:1 1 420px}
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .topbar h1{font-size:clamp(20px,2.6vw,28px); margin:4px 0 8px; font-weight:750}
  .position{color:var(--ink-2); font-size:15px; max-width:64ch}
  .badges{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
    white-space:nowrap;
  }
  .badge b{color:var(--ink); font-weight:700}
  .themebtn{cursor:pointer; user-select:none}

  /* tiles */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
  .tile .k{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .tile .v{font-size:26px; font-weight:750; margin-top:4px}
  .tile .s{font-size:12px; color:var(--muted); margin-top:2px}

  /* sections */
  section{margin:26px 0}
  .sec-head{display:flex; align-items:baseline; gap:12px; margin:0 2px 12px}
  .sec-head h2{font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .sec-head .hint{font-size:12px; color:var(--muted)}
  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px}
  .card h3{font-size:15px; font-weight:700; margin-bottom:8px}
  .card p{margin:6px 0; color:var(--ink-2)}
  .card .lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600}

  /* segmented composition bar (funnel / pillars / provenance) */
  .bar{display:flex; width:100%; height:30px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--surface-2)}
  .bar>span{display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; min-width:2px}
  .bar>span+span{box-shadow:inset 2px 0 0 var(--surface)}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px}
  .legend .item{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2)}
  .dot{width:11px; height:11px; border-radius:3px; flex:none}

  /* lever table */
  .tbl{width:100%; border-collapse:collapse; font-size:13.5px}
  .tbl th,.tbl td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top}
  .tbl th{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .tbl tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}

  /* pills */
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .pill .dot{width:8px; height:8px}
  .pv-dd{background:color-mix(in srgb,var(--dd) 15%,transparent); color:var(--dd)}
  .pv-di{background:color-mix(in srgb,var(--di) 15%,transparent); color:var(--di)}
  .pv-jg{background:color-mix(in srgb,var(--jg) 15%,transparent); color:var(--jg)}
  .fn-reach{background:color-mix(in srgb,var(--reach) 15%,transparent); color:var(--reach)}
  .fn-nurture{background:color-mix(in srgb,var(--nurture) 15%,transparent); color:var(--nurture)}
  .fn-activation{background:color-mix(in srgb,var(--activation) 15%,transparent); color:var(--activation)}
  .tag{display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2)}
  .glossary-term{cursor:help; border-bottom:1px dashed var(--muted)}
  .tags-row{display:flex; gap:5px; flex-wrap:wrap; margin-top:2px}
  .tag-role-niche{border-color:var(--reach)} .tag-role-topic{border-color:var(--nurture)} .tag-role-series{border-color:var(--activation)}

  /* calendar */
  .filters{display:flex; flex-wrap:wrap; gap:8px; margin:0 2px 12px}
  .chip{cursor:pointer; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2)}
  .chip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
  .reels{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px}
  .reel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 17px; display:flex; flex-direction:column; gap:10px; border-top:3px solid var(--role,var(--line))}
  .reel .rtop{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .reel .rid{font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.08em}
  .reel h3{font-size:15.5px; font-weight:750; line-height:1.25}
  .reel .rmeta{display:flex; flex-wrap:wrap; gap:6px}
  .hooks{background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:13px}
  .hooks div{margin:3px 0}
  .hooks .hk{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-right:6px}
  .row{font-size:13px; margin:0}
  .row .lbl{display:block; margin-bottom:1px}
  .rt-line{display:block; margin:2px 0}
  .rt-alts-lbl{font-size:11.5px; margin-top:6px}
  ul.rt-alts{margin:2px 0 0; font-size:12.5px}
  ul.rt-alts li{margin:2px 0; color:var(--ink-2)}
  .receipt{font-size:12px; color:var(--muted); border-top:1px dashed var(--line); padding-top:9px; margin-top:auto}

  ul.clean{margin:6px 0 0; padding-left:18px} ul.clean li{margin:4px 0; color:var(--ink-2)}
  .note{background:color-mix(in srgb,var(--accent) 8%,var(--surface)); border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line)); border-radius:10px; padding:10px 13px; font-size:13px; color:var(--ink-2)}
  .next-strip{background:color-mix(in srgb,var(--accent) 10%,var(--surface)); border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line)); border-radius:12px; padding:12px 16px; margin:14px 0; font-size:13.5px}
  .next-strip p{margin:3px 0}
  .beats-note{font-size:11px; color:var(--muted); font-style:italic; margin:2px 0 6px}
  .plan-error-banner{
    background:color-mix(in srgb,var(--activation) 10%,var(--surface));
    border:1px solid color-mix(in srgb,var(--activation) 35%,var(--line));
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px 20px; margin:20px auto; max-width:640px;
    font-size:14.5px; font-weight:600; color:var(--ink); text-align:center;
  }
  .foot{margin-top:34px; font-size:12px; color:var(--muted); text-align:center}
  @media (max-width:560px){ .wrap{padding:14px 12px 48px} .reels{grid-template-columns:1fr} }
</style>
</head>

  const app = document.getElementById('app');
  const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  // FRFRMU-1551: format/structure jargon (montage, day-in-life...) had nothing
  // explaining it. glossaryMap is built ONCE from PLAN.glossary (whatever terms
  // THIS plan actually used — never a hardcoded list) and read by fmtPill()
  // below as a hover title on every format/structure pill. LAZY on purpose:
  // this whole block sits between the `esc` and `LOGO_SRC` markers that
  // _dashboard_js.py extracts and evals standalone under Node (FRFRMU-1552's
  // test harness) — it must stay pure function/const DEFINITIONS with no
  // executable top-level statement, so it cannot read PLAN eagerly here
  // (PLAN itself is not assigned until after that extracted window, and
  // reading it this early is also a real `let` temporal-dead-zone crash in
  // a real browser, not just under Node).
  let _glossaryMapCache = null;
  const glossaryMap = () => {
    if (_glossaryMapCache) return _glossaryMapCache;
    _glossaryMapCache = new Map(
      (Array.isArray(PLAN.glossary) ? PLAN.glossary : [])
        .filter(g => g && g.field && g.term)
        .map(g => [`${g.field}:${String(g.term).toLowerCase()}`, g])
    );
    return _glossaryMapCache;
  };
  const fmtPill = (field, term) => {
    if (!term) return '';
    const g = glossaryMap().get(`${field}:${String(term).toLowerCase()}`);
    const title = g && g.plain ? ` title="${esc(g.plain)}"` : '';
    return `<span class="tag glossary-term"${title}>${esc(term)}</span>`;
  };
  // FRFRMU-1551: per-reel discovery (keywords + role-tagged hashtags) had
  // nowhere to render — the recipe ran, the output had no landing spot.
  const roleClass = { niche: 'tag-role-niche', topic: 'tag-role-topic', series: 'tag-role-series' };
  const renderDiscovery = (d) => {
    if (!d) return '';
    const keywords = Array.isArray(d.keywords) && d.keywords.length
      ? `<span class="muted">Search words:</span> ${esc(d.keywords.join(' · '))}` : '';
    const tags = Array.isArray(d.tags) ? d.tags : [];
    const tagPills = tags.map(t => {
      const cls = roleClass[t && t.role] || '';
      return `<span class="tag ${cls}">${esc(t && t.tag)}</span>`;
    }).join('');
    if (!keywords && !tagPills) return '';
    return `<p class="row"><span class="lbl">Discovery</span>${keywords}</p>`
      + (tagPills ? `<p class="row tags-row">${tagPills}</p>` : '');
  };
  // FRFRMU-1544: retention became an object ({open_loop, rehook:{options:[...]}, loop_back}) so
  // the mid-video re-hook is a real, checkable line instead of a one-sentence hook paraphrase.
  // A legacy plan's retention is still a plain string — esc(v) alone renders that fine; an
  // object would otherwise print as the literal text "[object Object]".
  // FRFRMU-1546: options[] can now carry 3-5 ranked entries with a `recommended` flag and a
  // `receipt` — the recommended one (or options[0] on an honest thin-data plan with none
  // flagged) is the main line above; the rest render as a short "other ways" list, each
  // with its real evidence note or an honest "craft option" label when it has none. A
  // 1544-only plan (single option, no receipt/recommended fields at all) still renders
  // correctly: one main line, no alt list, an honest "no niche data yet" note.
  const _rtEvidence = (o) => {
    const r = o && o.receipt;
    if (r && r.n) {
      const accts = r.accounts ? ` from ${r.accounts} account${r.accounts === 1 ? '' : 's'}` : '';
      return ` <span class="muted">(based on ${esc(r.n)} reel${r.n === 1 ? '' : 's'}${accts})</span>`;
    }
    return ' <span class="muted">(craft option — no niche data yet)</span>';
  };
  const renderRetention = v => {
    if (v == null) return '';
    if (typeof v !== 'object') return esc(v);
    const options = (v.rehook && Array.isArray(v.rehook.options)) ? v.rehook.options : [];
    let mainIdx = options.findIndex(o => o && o.recommended);
    if (mainIdx < 0) mainIdx = 0;
    const main = options[mainIdx] || {};
    const alts = options.filter((_, i) => i !== mainIdx);
    const altList = alts.length
      ? `<div class="muted rt-alts-lbl">Other ways to hold them here:</div>`
        + `<ul class="clean rt-alts">${alts.map(o =>
            `<li>${esc(o && o.line)}${_rtEvidence(o)}</li>`).join('')}</ul>`
      : '';
    return `<span class="rt-line"><span class="muted">Opens the loop:</span> ${esc(v.open_loop)}</span>`
      + `<span class="rt-line"><span class="muted">At ~40%, say or show:</span> ${esc(main.line)}${options.length ? _rtEvidence(main) : ''}</span>`
      + `<span class="rt-line"><span class="muted">Ends by:</span> ${esc(v.loop_back)}</span>`
      + altList;
  };
  // FRFRMU-1548: nothing told the customer a separate copywriter step exists.
  // Renders from PLAN.next_steps when the skill wrote it; a hard-coded
  // fallback covers an older plan JSON or a headless run that never wrote
  // it, so the strip always shows something. Whole-plan review-and-approve
  // gate (founder decision 2026-09-15) — no per-reel tick count here.
  const renderNextSteps = (ns) => {
    const whatThisIs = (ns && ns.what_this_is) ||
      'This is your strategy and a reel-by-reel outline — hooks, what holds people mid-reel, the ask, and a caption per reel.';
    const whatItIsNot = (ns && ns.what_it_is_not) ||
      'It is not the word-for-word script yet — the actual lines to say on camera.';
    const next = (ns && ns.copywriter && ns.copywriter.say)
      ? `Review the whole plan and approve it, then say "${ns.copywriter.say}" — it writes the scripts, on-screen lines and DM copy.`
      : 'Review the whole plan and approve it, then say "write the copy for this plan" — it writes the scripts, on-screen lines and DM copy.';
    return `<div class="next-strip">
      <p><b>What this is:</b> ${esc(whatThisIs)}</p>
      <p><b>What it is not yet:</b> ${esc(whatItIsNot)}</p>
      <p><b>Next:</b> ${esc(next)}</p>
    </div>`;
  };
  // Per-reel outline label (FRFRMU-1548): makes step-08-outline-recipe.md's
  // "we write BEATS, never a full script" stance visible to the customer.
  const BEATS_LABEL = 'Beats — what each moment does. The words come in the copywriter step.';
  const el = (h)=>{const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild;};
  const showError = (msg) => { app.innerHTML = '<div class="plan-error-banner">⚠️ ' + esc(msg) + '</div>'; };

  // FRFRMU-1552: renders PLAN.build_trace (the exact `steps` array sent to
  // record_build_steps, per the FRFRMU-1547 rule) as needed/pulled/got/bar/
  // decision per step. Old-shape steps (none of the five new fields) fall
  // back to `action`. Consecutive steps sharing a `loop_id` render as ONE
  // bordered sequence, never collapsed into a single line — same grouping
  // as the React BuildTracePanel this mirrors.
  const BAR_LABEL = {met:'Bar met', not_met:'Bar not met', thin:'Thin — below the bar', not_applicable:'No bar for this step'};
  function buildStepHtml(s) {
    const hasNewShape = s.needed || s.got || s.bar || s.decision;
    const retryNote = (s.retry_of_seq != null) ? ` (re-ran step ${esc(s.retry_of_seq)})` : '';
    const head = `<p class="lbl" style="margin:0">Step ${esc(s.seq)} — ${esc(s.kind)}${retryNote}</p>`;
    if (!hasNewShape) return `<div class="build-step">${head}<p>${esc(s.action)}</p></div>`;
    const pulled = (s.inputs||[]).map(i=>esc(i.args_summary)+(i.tool?` (${esc(i.tool)})`:'')).join('; ');
    const bar = s.bar ? `<p><b>Success bar:</b> ${esc(BAR_LABEL[s.bar.verdict]||s.bar.verdict)} — ${esc(s.bar.rule)}</p>` : '';
    return `<div class="build-step">${head}
      ${s.needed?`<p><b>Needed:</b> ${esc(s.needed)}</p>`:''}
      ${pulled?`<p><b>Pulled via:</b> ${pulled}</p>`:''}
      ${s.got?`<p><b>Got:</b> ${esc(s.got)}</p>`:''}
      ${bar}
      ${s.decision?`<p><b>Decision:</b> ${esc(s.decision)}</p>`:''}</div>`;
  }
  function buildTraceHtml(steps) {
    const groups = []; let loop = null, loopId = null;
    for (const s of steps) {
      if (s.loop_id) {
        if (loop && loopId === s.loop_id) loop.push(s);
        else { if (loop) groups.push(loop); loop = [s]; loopId = s.loop_id; }
      } else { if (loop) { groups.push(loop); loop = null; loopId = null; } groups.push(s); }
    }
    if (loop) groups.push(loop);
    return groups.map(g => Array.isArray(g)
      ? `<div class="build-loop"><p class="lbl">Check → re-check sequence (${g.length} steps)</p>${g.map(buildStepHtml).join('')}</div>`
      : buildStepHtml(g)).join('');
  }

      <div class="tile"><div class="k">Funnel mix</div><div class="v mono">${PLAN.funnel.reach}·${PLAN.funnel.nurture}·${PLAN.funnel.activation}</div><div class="s">reach · nurture · activation</div></div>
      <div class="tile"><div class="k">Evidence</div><div class="v mono">${rp.data_driven}·${rp.data_inferred}·${rp.judgment}</div><div class="s">data-driven · inferred · judgment</div></div>
      <div class="tile"><div class="k">Built from</div><div class="v mono">${esc((PLAN.receipts.coverage.match(/\d[\d,]*/)||['—'])[0])}</div><div class="s">of your analysed reels</div></div>
    </div>`));

  const section = (title,hint,body)=>{ const s=el(`<section><div class="sec-head"><h2>${esc(title)}</h2>${hint?`<span class="hint">${esc(hint)}</span>`:''}</div></section>`); s.appendChild(body); app.appendChild(s); };
  const bar = (items)=>{ // items: [{label,pct,cssvar}]
    const total=items.reduce((a,b)=>a+b.pct,0)||1;
    const segs=items.filter(i=>i.pct>0).map(i=>`<span style="flex:${i.pct};background:var(${i.cssvar})" title="${esc(i.label)}: ${i.pct}">${Math.round(i.pct/total*100)}%</span>`).join('');
    const leg=items.map(i=>`<span class="item"><span class="dot" style="background:var(${i.cssvar})"></span>${esc(i.label)} <b class="mono">${i.pct}</b></span>`).join('');
    return el(`<div><div class="bar">${segs}</div><div class="legend">${leg}</div></div>`);
  };

  // FRFRMU-1549: `cta` is a bare string in some saved plans and a
  // {type, text} object in others — read either, same as the backend's
  // cta_text() (plan_field_manifest.py), so this never shows blank for a CTA
  // that really exists.
  const ctaText = r => { const c = r && r.cta;
    if (typeof c === 'string') return c;
    if (c && typeof c === 'object' && typeof c.text === 'string') return c.text;
    return ''; };
  // FRFRMU-1547: `receipt` is the structured object submit_content_plan
  // actually saves ({source_handle|source_handles, n, median, reliability,
  // tag, note}) on real plans, but a plain prose string on old ones. esc()
  // on an object prints "[object Object]" — this turns it into a labelled
  // row instead, and still handles the old string shape.
  const receiptHtml = r => { const rc = r && r.receipt;
    if (rc == null || rc === '') return '';
    if (typeof rc === 'string') return esc(rc);
    if (typeof rc !== 'object') return '';
    const who = Array.isArray(rc.source_handles) ? rc.source_handles.join(', ') : (rc.source_handle || '');
    const bits = [];
    if (rc.tag) bits.push(esc(String(rc.tag)).toUpperCase());
    if (who) bits.push(esc(who));
    if (rc.n != null) bits.push('n=' + esc(rc.n));
    if (rc.median != null) bits.push('median ' + esc(rc.median));
    if (rc.reliability) bits.push(esc(rc.reliability));
    if (rc.note) bits.push(esc(rc.note));
    return bits.join(' · '); };
  // FRFRMU-1547: `reasoning` is the {receipts, expected_outcome, goal_served}
  // summary step-08-reasoning-recipe.md writes on every reel — labelled rows,
  // never "[object Object]".
  const reasoningHtml = r => { const rs = r && r.reasoning;
    if (rs == null) return '';
    if (typeof rs === 'string') return `<p class="row">${esc(rs)}</p>`;
    if (typeof rs !== 'object') return '';
    const parts = [];
    if (rs.receipts) parts.push(`<p class="row"><span class="lbl">Receipts</span>${esc(Array.isArray(rs.receipts)?rs.receipts.join('; '):rs.receipts)}</p>`);
    if (rs.expected_outcome) parts.push(`<p class="row"><span class="lbl">Expected</span>${esc(rs.expected_outcome)}</p>`);
    if (rs.goal_served) parts.push(`<p class="row"><span class="lbl">Goal</span>${esc(rs.goal_served)}</p>`);
    return parts.join(''); };
  // FRFRMU-1550: group reels by `date`, mirroring the server's own rule
  // (backend/app/services/reach/plan_calendar_view.py::build_calendar_view) —
  // ascending by date, a missing/unparseable date goes to an "Unscheduled"
  // strip (never dropped), so the reel count on screen always equals what was
  // saved. A plan with no dates at all (old plans, this file's own sample
  // data) shows no headers and looks exactly as it always did.
  const fmtCalDate = iso => {
    if (typeof iso !== 'string' || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return null;
    const d = new Date(iso.slice(0,10)+'T00:00:00');
    return isNaN(d.getTime()) ? null : d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  };
  const groupReelsByDate = reels => {
    const anchorByTie = {};
    (PLAN.anchors||[]).forEach(a=>{ if (a && a.id) anchorByTie[a.id]=a; });
    const groups = new Map();
    reels.forEach(r=>{
      const key = fmtCalDate(r.date) ? r.date.slice(0,10) : '__unscheduled__';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    const keys = [...groups.keys()].sort((a,b)=> a==='__unscheduled__'?1:(b==='__unscheduled__'?-1:a.localeCompare(b)));
    const showHeaders = keys.length > 1 || keys[0] !== '__unscheduled__';
    return keys.map(key=>{
      const groupReels = groups.get(key);
      const tie = groupReels[0] && groupReels[0].moment_tie;
      const anchor = tie ? anchorByTie[tie] : null;
      const label = !showHeaders ? null : key === '__unscheduled__'
        ? 'Unscheduled'
        : (fmtCalDate(key) || key) + (anchor ? ` — ${anchor.name||anchor.id}` : '');
      return {label, reels: groupReels};
    });
  };

  // ---- A. Strategy ----
  const strat = el(`<div class="grid g2"></div>`);
  // goal + funnel
  const gcard = el(`<div class="card"><div class="lbl">Goal & funnel objective</div><p>${esc(m.goal_detail)}</p></div>`);
  gcard.appendChild(bar([
    {label:'Reach',pct:PLAN.funnel.reach,cssvar:'--reach'},
    {label:'Nurture',pct:PLAN.funnel.nurture,cssvar:'--nurture'},
    {label:'Activation',pct:PLAN.funnel.activation,cssvar:'--activation'}]));
  gcard.appendChild(el(`<p class="muted" style="font-size:12.5px;margin-top:10px">${esc(PLAN.funnel.reasoning)}</p>`));
  strat.appendChild(gcard);
  // audience
  strat.appendChild(el(`<div class="card"><div class="lbl">Target audience · confidence ${esc(PLAN.audience.confidence)}</div>
    <p><b>${esc(PLAN.audience.segment)}</b></p>
    <div class="note">⚠️ On-ramp: ${esc(PLAN.audience.on_ramp)}</div></div>`));
  // pillars
  const pcard = el(`<div class="card" style="grid-column:1/-1"><div class="lbl">Content pillars & distribution</div></div>`);
  pcard.appendChild(bar(PLAN.pillars.map((p,i)=>({label:p.name,pct:p.pct,cssvar:['--reach','--nurture','--activation','--accent'][i%4]}))));
  pcard.appendChild(el(`<ul class="clean">${PLAN.pillars.map(p=>`<li><b>${esc(p.name)}</b> — ${esc(p.why)}</li>`).join('')}</ul>`));
  strat.appendChild(pcard);
  section('01 · Strategy','the why, before the calendar',strat);

  // patterns matched
  const pm = el(`<div class="card scroll"></div>`);
  pm.appendChild(el(`<table class="tbl"><thead><tr><th>Lever we're using</th><th>n</th><th>Median</th><th>Reliability</th><th>Evidence</th><th>Why it fits</th></tr></thead>
    <tbody>${PLAN.patterns_matched.map(p=>`<tr><td><b>${esc(p.lever)}</b></td><td class="mono">${esc(p.n)}</td><td class="mono">${esc(p.median)}</td><td>${esc(p.reliability)}</td><td>${pvPill(p.provenance)}</td><td class="muted">${esc(p.why)}</td></tr>`).join('')}</tbody></table>`));
  section('02 · Patterns matched','the proven levers this plan uses',pm);

  // patterns to test
  const pt = el(`<div class="grid g2"></div>`);
  PLAN.patterns_to_test.forEach(p=> pt.appendChild(el(`<div class="card"><h3>🧪 ${esc(p.name)}</h3><p><span class="lbl">Hypothesis</span>${esc(p.hypothesis)}</p><p><span class="lbl">Kill / scale</span>${esc(p.kill_scale)}</p></div>`)));
  section('03 · Patterns to test','every reel is a bet with a kill/scale rule',pt);

  // ---- B. Foundation ----
  const f = PLAN.foundation;
  const fcard = el(`<div class="card"><div class="grid g2">
    <div><div class="lbl">Searchable name</div><p class="mono">${esc(f.name_field)}</p><div class="lbl" style="margin-top:8px">Bio</div><p>${esc(f.bio)}</p></div>
    <div><div class="lbl">Pinned first 3</div><ul class="clean">${f.pinned.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  </div></div>`);
  section('04 · Foundation','fix the profile before posting',fcard);

  // ---- C. Calendar ----
  const calSec = el(`<section><div class="sec-head"><h2>05 · The calendar</h2><span class="hint">${PLAN.reels.length} reels — filter by funnel role</span></div>
    <div class="filters" id="filters"></div><div class="reels" id="reels"></div></section>`);
  app.appendChild(calSec);
  const reelsWrap = calSec.querySelector('#reels');
  const roleVar = r => (FN[r]?FN[r][1]:'--line');
  groupReelsByDate(PLAN.reels).forEach(group=>{
    if (group.label) {
      reelsWrap.appendChild(el(`<div class="cal-head" style="grid-column:1/-1;font-weight:700;margin-top:14px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em">${esc(group.label)}</div>`));
    }
    group.reels.forEach(r=>{
    reelsWrap.appendChild(el(`
      <article class="reel" data-role="${esc(r.funnel_role)}" style="--role:var(${roleVar(r.funnel_role)})">
        <div class="rtop"><div><span class="rid">${esc(r.id)}</span><h3>${esc(r.title)}</h3></div></div>
        <div class="rmeta">${fnPill(r.funnel_role)}${pvPill(r.provenance)}${fmtPill('structure', r.structure)}${fmtPill('format', r.format)}<span class="tag">${esc(r.effort)} effort</span><span class="tag">P${esc(r.priority)}</span><span class="tag">${esc(r.pillar)}</span>${r.series?`<span class="tag">${esc(r.series)}</span>`:''}${r.moment_tie?`<span class="tag">${esc(r.moment_tie)}</span>`:''}${r.date?`<span class="tag">📅 ${esc(r.date)}${r.time?' '+esc(r.time):''}${r.timezone?' '+esc(r.timezone):''}</span>`:''}</div>
        <div class="hooks">
          <div><span class="hk">Spoken</span>${esc(r.hook.spoken)}</div>
          <div><span class="hk">On-screen</span>${esc(r.hook.on_screen)}</div>
          <div><span class="hk">Visual</span>${esc(r.hook.visual)} <span class="muted">· ${esc(r.hook.sound)}</span></div>
        </div>
        <p class="row beats-note">${esc(BEATS_LABEL)}</p>
        <p class="row"><span class="lbl">Retention</span>${renderRetention(r.retention)}</p>
        <p class="row"><span class="lbl">CTA</span>${esc(ctaText(r))}</p>
        ${r.caption?`<p class="row"><span class="lbl">Caption</span>${esc(r.caption)}</p>`:''}
        ${Array.isArray(r.hashtags)&&r.hashtags.length?`<p class="row"><span class="lbl">Hashtags</span>${r.hashtags.map(h=>`<span class="tag">${esc(h)}</span>`).join(' ')}</p>`:''}
        ${r.needs_disclaimer?`<div class="note">⚠️ Compliance: this reel needs the "individual results vary" disclaimer.</div>`:''}
        <p class="row"><span class="lbl">Topic</span><span class="muted">data:</span> ${esc(r.topic_data)} · <span class="muted">idea:</span> ${esc(r.topic_idea)} · <span class="muted">angle:</span> ${esc(r.angle)} · <span class="muted">for:</span> ${esc(r.audience)}</p>
        ${renderDiscovery(r.discovery)}
        ${reasoningHtml(r)}
        <div class="receipt">${receiptHtml(r)}</div>
      </article>`));
    });
  });
  const roles=['all',...Object.keys(FN)];
  const filters=calSec.querySelector('#filters');
  roles.forEach(role=>{
    const label = role==='all'?'All':FN[role][0];
    const chip=el(`<button class="chip" aria-pressed="${role==='all'}">${esc(label)}</button>`);
    chip.onclick=()=>{ filters.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false')); chip.setAttribute('aria-pressed','true');
      reelsWrap.querySelectorAll('.reel').forEach(x=>{ x.style.display=(role==='all'||x.dataset.role===role)?'':'none'; }); };
    filters.appendChild(chip);
  });

  // ---- D. Execution ----
  const exec = el(`<div class="grid g2"></div>`);
  exec.appendChild(el(`<div class="card"><div class="lbl">Cadence & batching</div><p>${esc(PLAN.cadence.summary)}</p></div>`));
  exec.appendChild(el(`<div class="card"><div class="lbl">Distribution</div><p><b>Posting time.</b> ${esc(PLAN.distribution.posting_time)}</p><p><b>Trending audio.</b> ${esc(PLAN.distribution.trending_audio)}</p></div>`));
  exec.appendChild(el(`<div class="card"><div class="lbl">Community — Dream 100</div><p>${PLAN.community.dream100.map(h=>`<span class="tag">${esc(h)}</span>`).join(' ')}</p><p class="muted" style="font-size:12.5px">${esc(PLAN.community.routine)}</p></div>`));
  exec.appendChild(el(`<div class="card"><div class="lbl">KPIs & the loop</div><p>${PLAN.kpis.per_reel.map(k=>`<span class="tag">${esc(k)}</span>`).join(' ')}</p><p class="muted" style="font-size:12.5px">${esc(PLAN.kpis.kill_scale)}</p></div>`));
  exec.appendChild(el(`<div class="card" style="grid-column:1/-1"><div class="lbl">Captions / hashtags / SEO</div><p>${esc(PLAN.captions_seo)}</p></div>`));
  // FRFRMU-1551: "What these words mean" — one line per DISTINCT format/
  // structure term this plan actually used (never a fixed list), plus the
  // real example link visual-recipe already produces (V.2's watch_these).
  if (glossaryMap().size) {
    const rows = [...glossaryMap().values()].map(g => {
      const example = g.example_url
        ? ` <a href="${esc(g.example_url)}" target="_blank" rel="noopener">See one${g.example_note ? ': ' + esc(g.example_note) : ''}</a>`
        : '';
      return `<p><b>${esc(g.term)}</b> — ${esc(g.plain)}${example}</p>`;
    }).join('');
    exec.appendChild(el(`<div class="card" style="grid-column:1/-1"><div class="lbl">What these words mean</div>${rows}</div>`));
  }
  section('06 · Execution & measurement','how it gets made and how you learn',exec);

  // ---- honest benchmark ----
  app.appendChild(el(`<div class="note" style="margin:18px 2px">📏 <b>Honest benchmark.</b> ${esc(m.benchmark)}</div>`));

  // ---- E. Trust ----
  const rec = PLAN.receipts, c=PLAN.critic;
  const trust = el(`<div class="grid g2"></div>`);
  const tcard = el(`<div class="card"><div class="lbl">How this was built from YOUR data</div>
    <p>${esc(rec.coverage)}.</p>
    <p><span class="lbl">Provenance</span></p></div>`);
  tcard.appendChild(bar([
    {label:'Data-driven',pct:rec.provenance_split.data_driven,cssvar:'--dd'},
    {label:'Data-inferred',pct:rec.provenance_split.data_inferred,cssvar:'--di'},
    {label:'Judgment',pct:rec.provenance_split.judgment,cssvar:'--jg'}]));
  tcard.appendChild(el(`<p class="muted" style="font-size:12.5px;margin-top:10px">Tools run: ${rec.tools.map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</p>`));
  tcard.appendChild(el(`<p style="margin-top:8px">Drawn from ${rec.competitors.map(h=>`<span class="tag">${esc(h)}</span>`).join(' ')}</p>`));
  tcard.appendChild(el(`<div class="note" style="margin-top:10px">▶️ ${esc(rec.one_action)}</div>`));
  trust.appendChild(tcard);
  trust.appendChild(el(`<div class="card"><div class="lbl">Critic & rules-gate</div><p><b>Verdict:</b> ${esc(c.verdict)} · ${esc(c.rounds)} round(s)</p><p class="lbl" style="margin-top:6px">What the critic changed</p><ul class="clean">${c.changes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`));
  if (PLAN.decision_log && PLAN.decision_log.length) trust.appendChild(el(`<div class="card" style="grid-column:1/-1"><div class="lbl">How this plan was decided — plain-English trail (for QA)</div><ol class="clean">${PLAN.decision_log.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`));
  // FRFRMU-1552: the real step-by-step build trace — needed/pulled/got/bar/
  // decision per step, escalation loops shown as one connected sequence.
  // decision_log above stays the plain-English summary; this is the record.
  if (PLAN.build_trace && PLAN.build_trace.length) trust.appendChild(el(`<div class="card" style="grid-column:1/-1"><div class="lbl">How this was built — step by step (for QA)</div>${buildTraceHtml(PLAN.build_trace)}</div>`));
  section('07 · Trust','so you (and a reviewer) can check the plan',trust);

  app.appendChild(el(`<div class="foot"><img src="${LOGO_SRC}" alt="Reach Machine" style="height:18px;width:auto;display:inline-block;vertical-align:middle;margin-right:6px;opacity:.8">Reach Machine · rm-content-planner — every claim is data-driven, inferred, or judgment, labeled, never hidden.<div style="margin-top:4px">© 2026 Reach Machine. All rights reserved.</div></div>`));

  // theme toggle
  document.getElementById('theme').onclick=()=>{ const r=document.documentElement;
    const cur=r.getAttribute('data-theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    r.setAttribute('data-theme', cur==='dark'?'light':'dark'); };
  } catch (err) {
    console.error('Plan data has an unexpected shape', err);
    showError("This plan's data is in an unexpected shape and can't be shown fully. Ask for a fresh copy from the skill.");
  }
})();
</script>
</body>
</html>
